<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Orb — Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;position:absolute;top:0;left:0}
#ui{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center}
.btn{padding:8px 16px;border:1px solid rgba(255,255,255,0.15);border-radius:20px;background:rgba(0,0,0,0.7);color:#fff;font-size:12px;cursor:pointer;transition:all .2s;backdrop-filter:blur(10px)}
.btn:hover,.btn.active{border-color:#FF9D3D;background:rgba(255,157,61,0.15);color:#FF9D3D}
#shape-label{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;opacity:0.5;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="shape-label"></div>
<div id="ui">
  <div class="btn active" data-state="idle">Idle</div>
  <div class="btn" data-state="thinking">Thinking</div>
  <div class="btn" data-state="speaking">Speaking</div>
  <div class="btn" data-state="listening">Listening</div>
  <div class="btn" data-state="searching">Searching</div>
  <div class="btn" data-state="system_search">System Search</div>
  <div class="btn" data-state="system_launch">System Launch</div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const STREAMS=34,PPS=100,WINDINGS=2.4,N=STREAMS*PPS,R=55;
const particles=[];
for(let s=0;s<STREAMS;s++){
  const streamOffset=(s/STREAMS)*Math.PI*2;
  const tilt=(s%2===0?1:-1)*0.15;
  const isAmber=(s%3===0);
  for(let i=0;i<PPS;i++){
    const t=i/(PPS-1);
    const phi=-Math.PI/2+t*Math.PI;
    const theta=streamOffset+t*WINDINGS*Math.PI*2;
    const x=Math.cos(phi)*Math.cos(theta);
    const y=Math.sin(phi)+Math.sin(theta*0.5)*tilt*0.15;
    const z=Math.cos(phi)*Math.sin(theta);
    const len=Math.sqrt(x*x+y*y+z*z)||1;
    particles.push({
      tx:(x/len)*R,ty:(y/len)*R,tz:(z/len)*R,
      delay:Math.random()*0.18,dur:0.35+Math.random()*0.2,
      phase:Math.random()*Math.PI*2,speed:0.7+Math.random()*0.7,
      isAmber:isAmber?Math.random()<0.8:Math.random()<0.3,
      size:1.6+Math.random()*1.5,shapeSlot:Math.random()
    });
  }
}

const STATE_CONFIG={
  idle:{e:0.12,r:0.0035},
  listening:{e:0.14,r:0.007},
  thinking:{e:0.4,r:0.015},
  speaking:{e:0.5,r:0.0055},
  searching:{e:0.45,r:0.012},
  system_search:{e:0.35,r:0.009},
  system_launch:{e:0.55,r:0.018}
};

const state={current:'idle',energy:0.16,targetEnergy:0.16,rotSpeed:0.0042,targetRotSpeed:0.0042};
let rotY=0,rotX=0.16,time=0,startTime=null;

document.querySelectorAll('.btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const s=btn.dataset.state;
    state.current=s;
    state.targetEnergy=STATE_CONFIG[s].e;
    state.targetRotSpeed=STATE_CONFIG[s].r;
  });
});

function lerp(a,b,t){return a+(b-a)*t;}

function animate(ts){
  requestAnimationFrame(animate);
  if(startTime===null)startTime=ts;
  const elapsed=(ts-startTime)/1000;
  time++;

  state.energy=lerp(state.energy,state.targetEnergy,0.07);
  state.rotSpeed=lerp(state.rotSpeed,state.targetRotSpeed,0.04);
  rotY+=state.rotSpeed+state.energy*0.0012;
  rotX=0.16+Math.sin(time*0.0008)*0.04;

  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  const scale=Math.min(W,H)/160;

  // Background glow
  const bgGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,R*3*scale);
  const bgColors={idle:'#2A1608',thinking:'#080D2A',speaking:'#082A10',listening:'#2A0808',searching:'#2A1F08',system_search:'#1A082A',system_launch:'#082A2A'};
  bgGrad.addColorStop(0,bgColors[state.current]+'cc');
  bgGrad.addColorStop(1,'transparent');
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,W,H);

  const cY=Math.cos(rotY),sY=Math.sin(rotY),cX=Math.cos(rotX),sX=Math.sin(rotX);

  for(let i=0;i<N;i++){
    const p=particles[i];
    const pulse=1+Math.sin(time*0.02*p.speed+p.phase)*(0.03+state.energy*0.26);
    let x=p.tx*pulse,y=p.ty*pulse,z=p.tz*pulse;

    const x1=x*cY-z*sY,z1=x*sY+z*cY;
    const y1=y*cX-z1*sX,z2=y*sX+z1*cX;

    const px=cx+x1*scale,py=cy+y1*scale;
    const depth=(z2/R+1)/2;
    const twinkle=0.5+0.5*Math.sin(time*0.045*p.speed+p.phase);
    let alpha=(0.45+depth*0.5)*(0.55+twinkle*0.45);
    let r,g,b,sizeMult=1;

    switch(state.current){
      case'speaking':r=0.95+depth*0.05;g=0.60+depth*0.15;b=0.15+depth*0.10;sizeMult=1+state.energy*0.5;alpha*=1+state.energy*0.3;break;
      case'listening':r=0.15+depth*0.15;g=0.50+depth*0.20;b=0.90+depth*0.10;sizeMult=1+state.energy*0.2;break;
      case'thinking':r=0.50+depth*0.20;g=0.15+depth*0.15;b=0.80+depth*0.20;sizeMult=1+state.energy*0.3;break;
      case'searching':
        if(p.shapeSlot<0.3){const w=0.6+depth*0.4;r=w;g=w;b=w;sizeMult=0.55;alpha*=0.7+twinkle*0.3;}
        else{r=0.85+depth*0.15;g=0.08+depth*0.12;b=0.12+depth*0.18;}break;
      case'system_search':
        if(p.shapeSlot<0.3){const w=0.7+depth*0.3;r=w;g=w;b=w;sizeMult=0.5;alpha*=0.65+twinkle*0.35;}
        else{r=0.55+depth*0.2;g=0.80+depth*0.15;b=0.25+depth*0.15;}break;
      case'system_launch':
        if(p.shapeSlot<0.3){const w=0.9+depth*0.1;r=w;g=w;b=w;sizeMult=0.6;alpha*=0.8+twinkle*0.2;}
        else{r=0.90+depth*0.10;g=0.60+depth*0.20;b=0.10+depth*0.15;}break;
      default:
        if(p.isAmber){r=0.82+depth*0.18;g=0.47+depth*0.22;b=0.24+depth*0.16;}
        else{r=0.88+depth*0.18;g=0.80+depth*0.22;b=0.62+depth*0.16;}break;
    }

    const fs=p.size*(0.85+depth*0.35)*(1+state.energy*0.3)*sizeMult*scale;
    alpha=alpha.clamp(0,1);

    ctx.beginPath();
    ctx.arc(px,py,fs,0,Math.PI*2);
    ctx.fillStyle=`rgba(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)},${alpha})`;
    ctx.fill();
  }
}
requestAnimationFrame(animate);
</script>
</body>
</html>
